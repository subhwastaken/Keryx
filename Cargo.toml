[package]
name = "keryx"
version = "0.1.0"
edition = "2021"
default-run = "keryx"

[[bin]]
name = "keryx"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for NVIDIA/Groq/OpenAI APIs
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# .env loading
dotenvy = "0.15"

# Cross-platform mic recording
cpal = "0.15"

# WAV encoding for audio buffer
hound = "3.5"

# Global hotkey listener (non-macOS only; macOS uses native CGEventTap)
# rdev is listed under [target.'cfg(not(target_os = "macos"))'.dependencies] below

# Simulate keyboard input (paste)
enigo = "0.2"

# Cross-platform clipboard
arboard = "3"

# System tray icon
tray-icon = "0.19"

# Image for tray icon
image = "0.25"

# Desktop notifications (HUD feedback)
notify-rust = "4"

# Logging
log = "0.4"
env_logger = "0.11"

# Config/env
dirs = "5"

# Base64 for audio encoding
base64 = "0.22"

# Temp files
tempfile = "3"
fs2 = "0.4"

# Synchronization
parking_lot = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.22"
objc = "0.2"
block = "0.1.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# rdev used for global hotkey on Windows/Linux
rdev = "0.5"



[profile.release]
opt-level = 3
lto = true
strip = true
